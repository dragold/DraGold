<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DraGold Social Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #060409;
    --ink: #0a0810;
    --paper: #f7f3eb;     /* warm cream */
    --paper-soft: #ede6d7;
    --gold: #c9a96e;       /* muted gold (luxury, less hi-vis) */
    --gold-deep: #8a6f3d;
    --gold-bright: #fbbf24;
    --text: #f5f0e3;
    --muted: #9d9385;
    --line: rgba(201,169,110,0.25);
    --gain: #4ade80;
    --loss: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    min-height: 100vh; padding: 20px;
  }
  header { text-align: center; margin-bottom: 32px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 36px;
    color: var(--gold); font-variation-settings: 'opsz' 144;
    letter-spacing: -0.02em;
  }
  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 32px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: rgba(255,255,255,0.03); border: 1px solid var(--line);
    border-radius: 12px; padding: 24px;
  }
  .panel h2 {
    font-family: 'Fraunces', serif; font-weight: 700;
    font-size: 14px; color: var(--gold); margin-bottom: 16px;
    text-transform: uppercase; letter-spacing: 0.16em;
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; }
  .tabs button {
    flex: 1; padding: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); border-radius: 6px;
    cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .tabs button.active {
    background: var(--gold); color: var(--ink); border-color: var(--gold);
  }

  label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 10px 12px; margin-bottom: 14px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); font-size: 14px;
    font-family: inherit; outline: none;
  }
  input:focus, select:focus { border-color: var(--gold); }

  button.primary {
    width: 100%; padding: 14px;
    background: var(--gold); color: var(--ink);
    border: none; border-radius: 6px;
    font-weight: 700; font-size: 13px; cursor: pointer;
    margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  button.primary:disabled { opacity: 0.5; cursor: wait; }

  .search-results {
    max-height: 240px; overflow-y: auto;
    background: rgba(0,0,0,0.4); border-radius: 6px;
    margin-bottom: 14px; padding: 4px;
  }
  .search-results .row {
    display: flex; gap: 10px; padding: 8px; cursor: pointer;
    border-radius: 4px; align-items: center;
  }
  .search-results .row:hover, .search-results .row.selected {
    background: rgba(201,169,110,0.15);
  }
  .search-results img { width: 32px; height: 44px; object-fit: cover; border-radius: 3px; }
  .search-results .name { font-size: 12px; font-weight: 600; }
  .search-results .meta { font-size: 10px; color: var(--muted); }

  .preview-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .preview-frame {
    width: 540px; height: 540px;
    position: relative; overflow: hidden;
  }
  @media (max-width: 700px) { .preview-frame { width: 360px; height: 360px; margin-bottom: -180px; } }

  /* ============ POST 1080x1080 — luxury editorial ============ */
  .post {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1080px;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(201,169,110,0.10) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(201,169,110,0.06) 0%, transparent 50%);
    overflow: hidden;
    transform: scale(0.5);
    transform-origin: top left;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text);
  }
  .post.story {
    width: 1080px; height: 1920px;
    transform: scale(0.281);
  }
  .preview-frame.story { width: 304px; height: 540px; }

  /* Hairline border luxury frame */
  .post::before {
    content: ''; position: absolute;
    top: 28px; left: 28px; right: 28px; bottom: 28px;
    border: 1px solid var(--line);
    pointer-events: none; z-index: 1;
  }

  .post-header {
    position: absolute; top: 70px; left: 70px; right: 70px;
    display: flex; justify-content: space-between; align-items: center; z-index: 2;
    padding-bottom: 22px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 44px; height: 44px; }
  .brand .name {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px;
    color: var(--text); letter-spacing: -0.01em;
    font-variation-settings: 'opsz' 144;
  }
  .header-meta {
    text-align: right;
  }
  .header-meta .label {
    font-family: 'Space Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase;
  }
  .header-meta .date {
    font-family: 'Space Mono', monospace; font-size: 13px;
    color: var(--gold); margin-top: 4px;
  }

  .footer-strip {
    position: absolute; bottom: 70px; left: 70px; right: 70px;
    display: flex; justify-content: space-between; align-items: center; z-index: 2;
    padding-top: 22px; border-top: 1px solid var(--line);
  }
  .footer-strip .tag {
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .footer-strip .cta {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px;
    color: var(--gold); letter-spacing: 0.06em;
    font-variation-settings: 'opsz' 144;
  }
  .footer-strip .cta::after {
    content: ' →'; opacity: 0.7;
  }

  /* TEMPLATE 1: CARD OF THE DAY */
  .tmpl-card {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 200px 90px;
  }
  .tmpl-card .card-image {
    width: 360px; height: 504px;
    border-radius: 4px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,169,110,0.3);
    flex-shrink: 0;
  }
  .tmpl-card .card-image img { width: 100%; height: 100%; object-fit: cover; }
  .tmpl-card .info {
    margin-left: 60px; flex: 1; max-width: 480px;
  }
  .tmpl-card .eyebrow {
    font-family: 'Space Mono', monospace; font-size: 12px;
    color: var(--gold); text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .tmpl-card .card-name {
    font-family: 'Fraunces', serif; font-weight: 700;
    font-size: 64px; line-height: 1; margin-bottom: 16px;
    color: var(--text); letter-spacing: -0.02em;
    font-variation-settings: 'opsz' 144, 'SOFT' 50;
  }
  .tmpl-card .card-meta {
    font-size: 16px; color: var(--muted); margin-bottom: 40px;
    font-style: italic;
  }
  .tmpl-card .price-wrap {
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .tmpl-card .price-label {
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.2em; margin-bottom: 14px;
  }
  .tmpl-card .price-value {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 88px;
    color: var(--gold); line-height: 1;
    font-variation-settings: 'opsz' 144;
    letter-spacing: -0.03em;
  }
  .tmpl-card .delta {
    display: inline-block; margin-top: 14px;
    font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700;
    letter-spacing: 0.04em;
  }
  .delta.up { color: var(--gain); }
  .delta.down { color: var(--loss); }

  /* TEMPLATE 2: TOP MOVER */
  .tmpl-mover {
    position: absolute; inset: 0;
    padding: 220px 90px 200px; display: flex; flex-direction: column;
  }
  .tmpl-mover .headline {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 110px;
    line-height: 0.9; margin-bottom: 14px; color: var(--text);
    letter-spacing: -0.04em;
    font-variation-settings: 'opsz' 144, 'SOFT' 50;
  }
  .tmpl-mover .headline em {
    font-style: italic; color: var(--gold);
    font-variation-settings: 'opsz' 144, 'SOFT' 100;
  }
  .tmpl-mover .sub {
    font-family: 'Space Mono', monospace; font-size: 14px;
    color: var(--muted); margin-bottom: 50px; letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .tmpl-mover .mover-row {
    display: flex; gap: 50px; align-items: center; flex: 1;
  }
  .tmpl-mover .card-image {
    width: 260px; height: 364px; border-radius: 4px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,169,110,0.3);
    flex-shrink: 0;
  }
  .tmpl-mover .card-image img { width: 100%; height: 100%; object-fit: cover; }
  .tmpl-mover .stats { flex: 1; }
  .tmpl-mover .stat-name {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 38px;
    color: var(--text); line-height: 1.1; margin-bottom: 8px;
    letter-spacing: -0.01em;
    font-variation-settings: 'opsz' 144;
  }
  .tmpl-mover .stat-set {
    font-size: 15px; color: var(--muted); margin-bottom: 32px;
    font-style: italic;
  }
  .tmpl-mover .stat-row {
    display: flex; justify-content: space-between;
    padding: 18px 0; border-top: 1px solid var(--line);
  }
  .tmpl-mover .stat-row:last-child { border-bottom: 1px solid var(--line); }
  .tmpl-mover .stat-label {
    font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.16em;
    align-self: center;
  }
  .tmpl-mover .stat-value {
    font-family: 'Fraunces', serif; font-size: 36px; font-weight: 700;
    color: var(--gold); letter-spacing: -0.02em;
    font-variation-settings: 'opsz' 144;
  }
  .tmpl-mover .stat-value.up { color: var(--gain); }
  .tmpl-mover .stat-value.down { color: var(--loss); }

  /* TEMPLATE 3: SEALED ROI */
  .tmpl-roi {
    position: absolute; inset: 0;
    padding: 200px 90px; display: flex; flex-direction: column; gap: 40px;
  }
  .tmpl-roi .roi-eyebrow {
    font-family: 'Space Mono', monospace; font-size: 12px;
    color: var(--gold); text-transform: uppercase; letter-spacing: 0.24em;
    margin-bottom: 8px;
  }
  .tmpl-roi .roi-title {
    font-family: 'Fraunces', serif; font-weight: 700;
    font-size: 72px; line-height: 1; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.03em;
    font-variation-settings: 'opsz' 144, 'SOFT' 50;
  }
  .tmpl-roi .roi-title em { font-style: italic; color: var(--gold); }
  .tmpl-roi .roi-sub {
    font-size: 16px; color: var(--muted); margin-bottom: 24px;
    font-style: italic;
  }
  .tmpl-roi .roi-numbers {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .tmpl-roi .roi-cell {
    padding: 36px 24px;
    text-align: center;
    border-right: 1px solid var(--line);
  }
  .tmpl-roi .roi-cell:last-child { border-right: none; }
  .tmpl-roi .roi-cell .lbl {
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.18em; margin-bottom: 16px;
  }
  .tmpl-roi .roi-cell .val {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 64px; line-height: 1;
    letter-spacing: -0.02em;
    font-variation-settings: 'opsz' 144;
  }
  .roi-cell.cost .val { color: var(--text); }
  .roi-cell.pulled .val { color: var(--text); }
  .roi-cell.delta .val { color: var(--gain); }
  .roi-cell.delta.neg .val { color: var(--loss); }
  .tmpl-roi .roi-verdict {
    text-align: center; margin-top: auto;
    font-family: 'Fraunces', serif; font-style: italic;
    font-weight: 600; font-size: 28px; color: var(--gold);
    line-height: 1.3; max-width: 760px; margin-left: auto; margin-right: auto;
    font-variation-settings: 'opsz' 144, 'SOFT' 80;
  }
  .tmpl-roi .roi-verdict::before, .tmpl-roi .roi-verdict::after {
    content: '"'; opacity: 0.5;
  }
</style>
</head>
<body>

<header>
  <h1>DraGold Social Generator</h1>
  <p style="color: var(--muted); margin-top: 8px;">Ready-to-post 1080×1080 luxury editorial. Pokemon TCG search built in.</p>
</header>

<div class="layout">

  <!-- LEFT PANEL -->
  <div class="panel">
    <h2>Configure</h2>

    <div class="tabs">
      <button class="active" data-tpl="card">Card of day</button>
      <button data-tpl="mover">Top mover</button>
      <button data-tpl="roi">Pack ROI</button>
    </div>

    <label>Format</label>
    <select id="format">
      <option value="square">1080×1080 (IG / X / TikTok)</option>
      <option value="story">1080×1920 (Stories / Reels)</option>
    </select>

    <div id="card-fields">
      <label>Search Pokemon card</label>
      <input type="text" id="search-card" placeholder="Charizard, Umbreon VMAX..." />
      <div class="search-results" id="search-results" style="display:none"></div>

      <label>Card name</label>
      <input type="text" id="card-name" value="Umbreon VMAX Alt Art" />

      <label>Set / number</label>
      <input type="text" id="card-set" value="Evolving Skies · #215/203" />

      <label>FMV</label>
      <input type="number" id="card-fmv" value="580" step="0.01" />

      <label>Currency</label>
      <select id="card-currency">
        <option value="EUR">EUR (€)</option>
        <option value="USD">USD ($)</option>
        <option value="GBP">GBP (£)</option>
      </select>

      <label>24h change %</label>
      <input type="number" id="card-delta" value="12.4" step="0.1" />

      <label>Image URL</label>
      <input type="text" id="card-image" value="https://images.pokemontcg.io/swsh7/215_hires.png" />

      <label>Language</label>
      <select id="card-lang">
        <option value="EN">English</option>
        <option value="JP">Japanese (+35%)</option>
        <option value="DE">German (-22%)</option>
        <option value="FR">French (-28%)</option>
        <option value="IT">Italian (-35%)</option>
        <option value="ES">Spanish (-32%)</option>
      </select>
    </div>

    <div id="roi-fields" style="display:none">
      <label>Set name</label>
      <input type="text" id="roi-set" value="Surging Sparks" />

      <label>Boosters opened</label>
      <input type="number" id="roi-packs" value="100" />

      <label>Total cost</label>
      <input type="number" id="roi-cost" value="420" step="0.01" />

      <label>Total pulls value</label>
      <input type="number" id="roi-pulled" value="487" step="0.01" />

      <label>Verdict line</label>
      <input type="text" id="roi-verdict" value="Break even after fees. Hold sealed instead." />
    </div>

    <button class="primary" id="download-btn">Download PNG</button>
    <p style="margin-top: 14px; font-size: 11px; color: var(--muted); text-align: center;">
      Preview is scaled. PNG exports at full 1080.
    </p>
  </div>

  <!-- PREVIEW -->
  <div class="panel">
    <h2>Preview</h2>
    <div class="preview-wrap">
      <div class="preview-frame" id="preview-frame">
        <div class="post" id="post"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let template = 'card'
  let format = 'square'

  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      template = btn.dataset.tpl
      document.getElementById('card-fields').style.display = template === 'roi' ? 'none' : 'block'
      document.getElementById('roi-fields').style.display = template === 'roi' ? 'block' : 'none'
      render()
    })
  })

  document.getElementById('format').addEventListener('change', (e) => {
    format = e.target.value
    render()
  })

  document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', render))

  let searchTimer
  document.getElementById('search-card').addEventListener('input', (e) => {
    clearTimeout(searchTimer)
    const q = e.target.value.trim()
    const box = document.getElementById('search-results')
    if (!q) { box.style.display = 'none'; return }
    searchTimer = setTimeout(async () => {
      const r = await fetch(`https://api.pokemontcg.io/v2/cards?q=name:"${encodeURIComponent(q)}*"&pageSize=12&orderBy=-set.releaseDate`)
      const data = await r.json()
      box.innerHTML = ''
      box.style.display = 'block'
      ;(data.data || []).forEach(c => {
        const fmv = c.cardmarket?.prices?.averageSellPrice ?? c.tcgplayer?.prices?.holofoil?.market ?? 0
        const row = document.createElement('div')
        row.className = 'row'
        row.innerHTML = `
          <img src="${c.images?.small || ''}" alt="">
          <div style="flex:1; min-width:0;">
            <div class="name">${c.name}</div>
            <div class="meta">${c.set?.name || ''} #${c.number || ''} · €${fmv.toFixed(2)}</div>
          </div>`
        row.addEventListener('click', () => {
          document.getElementById('card-name').value = c.name
          document.getElementById('card-set').value = `${c.set?.name || ''} · #${c.number || ''}`
          document.getElementById('card-fmv').value = fmv.toFixed(2)
          document.getElementById('card-image').value = c.images?.large || c.images?.small || ''
          box.style.display = 'none'
          render()
        })
        box.appendChild(row)
      })
    }, 400)
  })

  function fmtPrice(value, currency) {
    const sym = { EUR: '€', USD: '$', GBP: '£' }[currency] || ''
    return sym + Number(value || 0).toFixed(2)
  }

  function render() {
    const post = document.getElementById('post')
    const frame = document.getElementById('preview-frame')
    post.classList.toggle('story', format === 'story')
    frame.classList.toggle('story', format === 'story')

    const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' })

    let headerMeta = template === 'card'
      ? `<span class="label">Card of the Day</span>`
      : template === 'mover'
        ? `<span class="label">Market Watch</span>`
        : `<span class="label">Pack Performance</span>`

    let inner = `
      <div class="post-header">
        <div class="brand">
          <img src="/public/assets/logo-gold.png" onerror="this.src='../public/assets/logo-gold.png'" alt="DraGold">
          <span class="name">DraGold</span>
        </div>
        <div class="header-meta">
          ${headerMeta}
          <div class="date">${today.toUpperCase()}</div>
        </div>
      </div>
    `

    if (template === 'card') {
      const name = document.getElementById('card-name').value
      const set = document.getElementById('card-set').value
      const fmv = document.getElementById('card-fmv').value
      const currency = document.getElementById('card-currency').value
      const delta = parseFloat(document.getElementById('card-delta').value || '0')
      const image = document.getElementById('card-image').value
      const lang = document.getElementById('card-lang').value
      const up = delta >= 0
      inner += `
        <div class="tmpl-card">
          <div class="card-image"><img src="${image}" crossorigin="anonymous" alt=""></div>
          <div class="info">
            <p class="eyebrow">Featured · ${lang} edition</p>
            <h1 class="card-name">${name}</h1>
            <p class="card-meta">${set}</p>
            <div class="price-wrap">
              <p class="price-label">Fair Market Value</p>
              <p class="price-value">${fmtPrice(fmv, currency)}</p>
              <span class="delta ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${Math.abs(delta).toFixed(1)}% · 24h</span>
            </div>
          </div>
        </div>
      `
    } else if (template === 'mover') {
      const name = document.getElementById('card-name').value
      const set = document.getElementById('card-set').value
      const fmv = document.getElementById('card-fmv').value
      const currency = document.getElementById('card-currency').value
      const delta = parseFloat(document.getElementById('card-delta').value || '0')
      const image = document.getElementById('card-image').value
      const up = delta >= 0
      inner += `
        <div class="tmpl-mover">
          <h1 class="headline">Top <em>Mover</em></h1>
          <p class="sub">${today}</p>
          <div class="mover-row">
            <div class="card-image"><img src="${image}" crossorigin="anonymous" alt=""></div>
            <div class="stats">
              <h2 class="stat-name">${name}</h2>
              <p class="stat-set">${set}</p>
              <div class="stat-row">
                <span class="stat-label">Current FMV</span>
                <span class="stat-value">${fmtPrice(fmv, currency)}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">24h Change</span>
                <span class="stat-value ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${Math.abs(delta).toFixed(1)}%</span>
              </div>
            </div>
          </div>
        </div>
      `
    } else if (template === 'roi') {
      const set = document.getElementById('roi-set').value
      const packs = document.getElementById('roi-packs').value
      const cost = parseFloat(document.getElementById('roi-cost').value || '0')
      const pulled = parseFloat(document.getElementById('roi-pulled').value || '0')
      const verdict = document.getElementById('roi-verdict').value
      const pl = pulled - cost
      const isPositive = pl >= 0
      inner += `
        <div class="tmpl-roi">
          <p class="roi-eyebrow">Real Data · Honest Result</p>
          <h1 class="roi-title">${packs} packs <em>opened</em></h1>
          <p class="roi-sub">${set} · ${today}</p>
          <div class="roi-numbers">
            <div class="roi-cell cost">
              <p class="lbl">Invested</p>
              <p class="val">€${cost.toFixed(0)}</p>
            </div>
            <div class="roi-cell pulled">
              <p class="lbl">Pulled value</p>
              <p class="val">€${pulled.toFixed(0)}</p>
            </div>
            <div class="roi-cell delta ${isPositive ? '' : 'neg'}">
              <p class="lbl">${isPositive ? 'Profit' : 'Loss'}</p>
              <p class="val">${isPositive ? '+' : ''}€${pl.toFixed(0)}</p>
            </div>
          </div>
          <p class="roi-verdict">${verdict}</p>
        </div>
      `
    }

    inner += `
      <div class="footer-strip">
        <span class="tag">${template === 'roi' ? 'Pack ROI Series' : template === 'mover' ? 'Daily Market Watch' : 'Daily Pick'}</span>
        <span class="cta">dragold.org</span>
      </div>
    `
    post.innerHTML = inner
  }

  document.getElementById('download-btn').addEventListener('click', async () => {
    const btn = document.getElementById('download-btn')
    btn.disabled = true
    btn.textContent = 'Generating...'

    const post = document.getElementById('post')
    const originalTransform = post.style.transform
    post.style.transform = 'none'

    try {
      const canvas = await html2canvas(post, {
        backgroundColor: '#0a0810',
        scale: 1,
        useCORS: true,
        allowTaint: true,
        logging: false,
      })
      const link = document.createElement('a')
      const name = (document.getElementById('card-name').value || 'dragold').replace(/[^a-z0-9]+/gi, '-').toLowerCase()
      link.download = `dragold-${template}-${name}-${Date.now()}.png`
      link.href = canvas.toDataURL('image/png')
      link.click()
    } catch (err) {
      alert('Render error: ' + err.message)
    } finally {
      post.style.transform = originalTransform
      btn.disabled = false
      btn.textContent = 'Download PNG'
    }
  })

  render()
</script>

</body>
</html>
