name: Full Card Sync (Pokemon + One Piece)

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      tcg:
        description: 'TCG da sincronizzare (pokemon, op)'
        required: false
        default: 'pokemon,op'
      lang:
        description: 'Lingue (en, ja)'
        required: false
        default: 'en,ja'
      set:
        description: 'Set specifico (es: sv3, OP-05). Lascia vuoto per tutti.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run - solo fetch, nessuna scrittura su DB'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    name: Sync catalogo carte
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installa dipendenze
        run: npm install @supabase/supabase-js
      - name: Run sync (scheduled)
        if: github.event_name == 'schedule'
        run: node scripts/sync-full.js --tcg=pokemon,op --lang=en,ja
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POKEMONTCG_API_KEY:   ${{ secrets.POKEMONTCG_API_KEY }}
      - name: Run sync (manuale)
        if: github.event_name == 'workflow_dispatch'
        run: |
          ARGS="--tcg=${{ github.event.inputs.tcg }} --lang=${{ github.event.inputs.lang }}"
          if [ -n "${{ github.event.inputs.set }}" ]; then
            ARGS="$ARGS --set=${{ github.event.inputs.set }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/sync-full.js $ARGS
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POKEMONTCG_API_KEY:   ${{ secrets.POKEMONTCG_API_KEY }}
