name: Deploy fetch-ebay-prices Edge Function

on:
  push:
      branches:
            - main
                paths:
                      - 'supabase/functions/fetch-ebay-prices/**'
                        workflow_dispatch:

                        jobs:
                          deploy:
                              runs-on: ubuntu-latest
                                  timeout-minutes: 10
                                      steps:
                                            - uses: actions/checkout@v4
                                                  - name: Deploy via Node script
                                                          run: node deploy-fetch-ebay.cjs
                                                                  env:
                                                                            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                                                                                      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
