name: Sync One Piece JA (manual dry-run validation)

# TEMPORANEO: workflow dedicato a validare
#   node scripts/sync-onepiece-ja.js --dry-run --limit=20
# tramite GitHub Actions, senza esporre SUPABASE_SERVICE_KEY localmente.
# Da rimuovere dopo la validazione (vedi CLAUDE.md §11: non è documentazione
# permanente, è solo uno strumento operativo temporaneo).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nessuna scrittura su DB)'
        required: false
        type: boolean
        default: true
      limit:
        description: 'Numero massimo di carte da processare in questa esecuzione'
        required: false
        type: string
        default: '20'
      retry_failed:
        description: 'Ritenta anche le carte marcate "non trovata"/"id mismatch" nei run precedenti'
        required: false
        type: boolean
        default: false

jobs:
  sync-onepiece-ja-dry-run:
    name: Sync One Piece JA (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm ci

      - name: Run sync-onepiece-ja.js
        run: |
          ARGS="--limit=${{ inputs.limit }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.retry_failed }}" = "true" ]; then
            ARGS="$ARGS --retry-failed"
          fi
          node scripts/sync-onepiece-ja.js $ARGS
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
