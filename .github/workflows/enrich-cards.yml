name: Enrich Cards (illustrator/evolveFrom)

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Numero di carte da arricchire in questo run'
        required: false
        default: '500'
      lang:
        description: 'Lingue (en,ja,it,fr,de,es,pt,id)'
        required: false
        default: 'en,ja,it,fr,de,es,pt,id'
      dry_run:
        description: 'Dry-run: sola lettura Supabase, nessuna chiamata TCGdex, nessuna scrittura'
        required: false
        type: boolean
        default: false
      page_size:
        description: 'Righe per pagina Supabase (max 1000, cap PostgREST db.max_rows)'
        required: false
        default: '500'
      time_budget_min:
        description: 'Minuti massimi di esecuzione prima di fermarsi in modo pulito'
        required: false
        default: '25'

jobs:
  enrich:
    name: Enrich Pokemon cards (TCGdex detail)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run enrichment (scheduled)
        if: github.event_name == 'schedule'
        run: node scripts/enrich-cards.js --limit=2000 --lang=en --page-size=500 --time-budget-min=25
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run enrichment (manuale)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/enrich-cards.js --limit=${{ github.event.inputs.limit }} --lang=${{ github.event.inputs.lang }} --page-size=${{ github.event.inputs.page_size }} --time-budget-min=${{ github.event.inputs.time_budget_min }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
