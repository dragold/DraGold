name: Enrich Cards (illustrator/evolveFrom)

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Numero di carte da arricchire in questo run'
        required: false
        default: '500'
      lang:
        description: 'Lingue (en,ja,it,fr,de,es,pt,id)'
        required: false
        default: 'en,ja,it,fr,de,es,pt,id'

jobs:
  enrich:
    name: Enrich Pokemon cards (TCGdex detail)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run enrichment (scheduled)
        if: github.event_name == 'schedule'
        run: node scripts/enrich-cards.js --limit=500
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run enrichment (manuale)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/enrich-cards.js --limit=${{ github.event.inputs.limit }} --lang=${{ github.event.inputs.lang }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
